#
# GitHub Actions workflow: run the SERI test suite on every push and PR
# across the supported OS x Python matrix.
#
# Reference: https://docs.github.com/en/actions

name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.9", "3.10", "3.11", "3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package and dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Show installed package versions
        run: pip list

      - name: Run pytest
        run: pytest -v --tb=short

      - name: Run doctests in seri/
        run: pytest --doctest-modules seri/ -v --tb=short

  all-tests-pass:
    name: All tests pass
    needs: test
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Verify all matrix jobs succeeded
        run: |
          if [ "${{ needs.test.result }}" != "success" ]; then
            echo "One or more matrix test jobs failed."
            exit 1
          fi
          echo "All matrix test jobs succeeded."
