#
# GitHub Actions workflow: build sdist + wheel and publish to PyPI on
# every published GitHub release. Uses PyPI Trusted Publishing (no API
# token needed once configured at https://pypi.org/manage/account/publishing/).
#
# Reference: https://docs.pypi.org/trusted-publishers/

name: release-to-pypi

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build-and-publish:
    name: Build and publish to PyPI
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build backend
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade build

      - name: Build sdist and wheel
        run: python -m build

      - name: Verify built distributions
        run: |
          ls -la dist/
          python -m pip install --upgrade twine
          twine check dist/*

      - name: Publish to PyPI via Trusted Publishing
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          verbose: true